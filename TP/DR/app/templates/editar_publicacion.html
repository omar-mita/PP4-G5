{% extends 'base.html' %}

{% block content %}

<div class="panel-contenido">

    <h2>Editar publicacion</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Guardar cambios
        </button>

        <a href="{% url 'mis_publicaciones' %}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}

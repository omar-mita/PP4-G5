{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoptDog</title>
    <link rel="stylesheet" href="{% static 'styles/styles.css' %}?v=4">
</head>
<body>
<header>
    <h1>🐾 AdoptDog</h1>

    <nav>
        <a href="{% url 'index' %}">Inicio</a>
        <a href="{% url 'nosotros' %}">Nosotros</a>
        <a href="{% url 'contacto' %}">Contacto</a>

        {% if user.is_authenticated %}
            <a href="{% url 'publicar_perro' %}">Publicar perro</a>
            <a href="{% url 'mis_publicaciones' %}">Mis publicaciones</a>
            <a href="{% url 'reportes' %}">Reportes</a>
            <a href="{% url 'cambiar_password' %}">Cambiar contraseña</a>
            <a href="{% url 'cerrar_sesion' %}">Cerrar sesión</a>
        {% else %}
            <a href="{% url 'loguearse' %}">Login</a>
            <a href="{% url 'registro' %}">Registro</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>&copy; 2026 AdoptDog. Todos los derechos reservados.</p>
</footer>
</body>
</html>

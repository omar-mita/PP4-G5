{% extends "base.html" %}

{% block content %}

<div class="panel-contenido">

    <h1>Iniciar sesión</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Ingresar</button>
    </form>

</div>

{% endblock %}
